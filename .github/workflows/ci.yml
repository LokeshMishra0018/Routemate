name: RouteMate CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend CI (Lint, Typecheck, Test, Build)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: routemate_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Backend Typecheck
        run: npm --prefix backend run build

      - name: Run Backend Integration & Unit Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/routemate_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key_1234567890
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_1234567890
        run: npm --prefix backend run test

  # -------------------------------------------------------------
  # Job 2: Frontend CI (Typecheck, Vitest, Production Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Typecheck
        run: npm --prefix frontend run typecheck

      - name: Run Frontend Tests
        run: npm --prefix frontend run test

      - name: Frontend Production Build
        run: npm --prefix frontend run build
